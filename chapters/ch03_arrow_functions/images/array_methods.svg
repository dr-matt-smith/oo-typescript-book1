<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="Arial, sans-serif">
  <rect width="780" height="380" fill="#ffffff"/>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/>
    </marker>
  </defs>
  <g font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace">
    <!-- source array -->
    <g>
      <rect x="20" y="30" width="58" height="34" rx="5" fill="#a8dadc" stroke="#457b9d"/><text x="49" y="52" text-anchor="middle">55</text>
      <rect x="84" y="30" width="58" height="34" rx="5" fill="#a8dadc" stroke="#457b9d"/><text x="113" y="52" text-anchor="middle">72</text>
      <rect x="148" y="30" width="58" height="34" rx="5" fill="#a8dadc" stroke="#457b9d"/><text x="177" y="52" text-anchor="middle">30</text>
    </g>
    <text x="230" y="52" fill="#5b6472" font-family="Arial, sans-serif" font-size="13">an array of marks</text>

    <!-- map -->
    <text x="20" y="110" fill="#1d3557" font-weight="bold">.map((m) =&gt; m + 5)</text>
    <line x1="290" y1="105" x2="420" y2="105" stroke="#1d3557" stroke-width="2" marker-end="url(#m)"/>
    <rect x="430" y="88" width="58" height="34" rx="5" fill="#f1faee" stroke="#457b9d"/><text x="459" y="110" text-anchor="middle">60</text>
    <rect x="494" y="88" width="58" height="34" rx="5" fill="#f1faee" stroke="#457b9d"/><text x="523" y="110" text-anchor="middle">77</text>
    <rect x="558" y="88" width="58" height="34" rx="5" fill="#f1faee" stroke="#457b9d"/><text x="587" y="110" text-anchor="middle">35</text>
    <text x="630" y="110" fill="#5b6472" font-family="Arial, sans-serif" font-size="12">every element changed</text>

    <!-- filter -->
    <text x="20" y="175" fill="#1d3557" font-weight="bold">.filter((m) =&gt; m &gt;= 40)</text>
    <line x1="290" y1="170" x2="420" y2="170" stroke="#1d3557" stroke-width="2" marker-end="url(#m)"/>
    <rect x="430" y="153" width="58" height="34" rx="5" fill="#f1faee" stroke="#457b9d"/><text x="459" y="175" text-anchor="middle">55</text>
    <rect x="494" y="153" width="58" height="34" rx="5" fill="#f1faee" stroke="#457b9d"/><text x="523" y="175" text-anchor="middle">72</text>
    <text x="630" y="175" fill="#5b6472" font-family="Arial, sans-serif" font-size="12">only those that pass</text>

    <!-- reduce -->
    <text x="20" y="240" fill="#1d3557" font-weight="bold">.reduce((sum, m) =&gt; sum + m, 0)</text>
    <line x1="340" y1="235" x2="420" y2="235" stroke="#1d3557" stroke-width="2" marker-end="url(#m)"/>
    <rect x="430" y="218" width="58" height="34" rx="5" fill="#2a9d8f"/><text x="459" y="240" text-anchor="middle" fill="#ffffff">157</text>
    <text x="630" y="240" fill="#5b6472" font-family="Arial, sans-serif" font-size="12">combined into one</text>

    <!-- find -->
    <text x="20" y="305" fill="#1d3557" font-weight="bold">.find((m) =&gt; m &gt; 60)</text>
    <line x1="290" y1="300" x2="420" y2="300" stroke="#1d3557" stroke-width="2" marker-end="url(#m)"/>
    <rect x="430" y="283" width="58" height="34" rx="5" fill="#2a9d8f"/><text x="459" y="305" text-anchor="middle" fill="#ffffff">72</text>
    <text x="630" y="305" fill="#5b6472" font-family="Arial, sans-serif" font-size="12">the first that passes</text>
  </g>
  <text x="390" y="360" font-size="13" fill="#5b6472" text-anchor="middle">The original array is never changed - each method gives back something new.</text>
</svg>
