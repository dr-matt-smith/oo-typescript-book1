<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3557">FizzBuzz, one small cycle at a time</text>
<text x="16" y="82" font-size="13" font-weight="bold" fill="#e63946">Red</text>
<text x="16" y="98" font-size="11" fill="#1b1f2a">a new test</text>
<text x="16" y="170" font-size="13" font-weight="bold" fill="#2a9d8f">Green</text>
<text x="16" y="186" font-size="11" fill="#1b1f2a">smallest</text>
<text x="16" y="200" font-size="11" fill="#1b1f2a">change</text>
<text x="146.0" y="54" text-anchor="middle" font-size="12" fill="#457b9d">cycle 1</text>
<rect x="90" y="64" width="112" height="46" rx="6" fill="#fde8ea" stroke="#e63946" stroke-width="1.5"/>
<text x="146.0" y="92" text-anchor="middle" font-size="12" fill="#1b1f2a">1 is said as 1</text>
<line x1="146.0" y1="112" x2="146.0" y2="140" stroke="#1d3557" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="90" y="144" width="112" height="58" rx="6" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="98" y="168" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">return "1"</text>
<text x="264.0" y="54" text-anchor="middle" font-size="12" fill="#457b9d">cycle 2</text>
<rect x="208" y="64" width="112" height="46" rx="6" fill="#fde8ea" stroke="#e63946" stroke-width="1.5"/>
<text x="264.0" y="92" text-anchor="middle" font-size="12" fill="#1b1f2a">2 is said as 2</text>
<line x1="264.0" y1="112" x2="264.0" y2="140" stroke="#1d3557" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="208" y="144" width="112" height="58" rx="6" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="216" y="168" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">return `${n}`</text>
<text x="382.0" y="54" text-anchor="middle" font-size="12" fill="#457b9d">cycle 3</text>
<rect x="326" y="64" width="112" height="46" rx="6" fill="#fde8ea" stroke="#e63946" stroke-width="1.5"/>
<text x="382.0" y="92" text-anchor="middle" font-size="12" fill="#1b1f2a">3 is Fizz</text>
<line x1="382.0" y1="112" x2="382.0" y2="140" stroke="#1d3557" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="326" y="144" width="112" height="58" rx="6" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="334" y="168" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">if n % 3 === 0</text>
<text x="334" y="186" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">  return "Fizz"</text>
<text x="500.0" y="54" text-anchor="middle" font-size="12" fill="#457b9d">cycle 4</text>
<rect x="444" y="64" width="112" height="46" rx="6" fill="#fde8ea" stroke="#e63946" stroke-width="1.5"/>
<text x="500.0" y="92" text-anchor="middle" font-size="12" fill="#1b1f2a">5 is Buzz</text>
<line x1="500.0" y1="112" x2="500.0" y2="140" stroke="#1d3557" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="444" y="144" width="112" height="58" rx="6" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="452" y="168" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">if n % 5 === 0</text>
<text x="452" y="186" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">  return "Buzz"</text>
<text x="618.0" y="54" text-anchor="middle" font-size="12" fill="#457b9d">no new cycle</text>
<rect x="562" y="64" width="112" height="46" rx="6" fill="#f1faee" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="618.0" y="92" text-anchor="middle" font-size="12" fill="#1b1f2a">6 and 99 are Fizz</text>
<line x1="618.0" y1="112" x2="618.0" y2="140" stroke="#1d3557" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="562" y="144" width="112" height="58" rx="6" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="570" y="168" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">nothing to do:</text>
<text x="570" y="186" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">already green</text>
<text x="736.0" y="54" text-anchor="middle" font-size="12" fill="#457b9d">cycle 5</text>
<rect x="680" y="64" width="112" height="46" rx="6" fill="#fde8ea" stroke="#e63946" stroke-width="1.5"/>
<text x="736.0" y="92" text-anchor="middle" font-size="12" fill="#1b1f2a">15 is FizzBuzz</text>
<line x1="736.0" y1="112" x2="736.0" y2="140" stroke="#1d3557" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="680" y="144" width="112" height="58" rx="6" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="688" y="168" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">check 15 first:</text>
<text x="688" y="186" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b1f2a" xml:space="preserve">  → "FizzBuzz"</text>
<text x="16" y="256" font-size="13" font-weight="bold" fill="#457b9d">Refactor</text>
<rect x="90" y="228" width="702" height="50" rx="6" fill="#a8dadc" stroke="#457b9d" stroke-width="1.5"/>
<text x="441.0" y="250" text-anchor="middle" font-size="13" fill="#1d3557">named constants · an isDivisibleBy helper · build the answer from "Fizz" + "Buzz"</text>
<text x="441.0" y="268" text-anchor="middle" font-size="12" fill="#1b1f2a">every test stays green after every change</text>
<text x="400" y="312" text-anchor="middle" font-size="12" fill="#5b6472">Each cycle: write one failing test, make it pass with the least code, then tidy up only while everything is green.</text>
</svg>