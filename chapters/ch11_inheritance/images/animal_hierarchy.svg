<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Arial, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <defs>
    <marker id="tri" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M2,2 L18,10 L2,18 Z" fill="#ffffff" stroke="#1d3557" stroke-width="2"/>
    </marker>
  </defs>
  <!-- Animal -->
  <rect x="230" y="20" width="300" height="170" rx="6" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
  <rect x="230" y="20" width="300" height="46" rx="6" fill="#1d3557"/>
  <text x="380" y="38" text-anchor="middle" font-size="12" fill="#a8dadc">«abstract»</text>
  <text x="380" y="58" text-anchor="middle" font-size="18" font-style="italic" font-weight="bold" fill="#ffffff">Animal</text>
  <text x="245" y="88" font-size="14" fill="#1b1f2a"># name: string  (readonly)</text>
  <line x1="230" y1="98" x2="530" y2="98" stroke="#1d3557"/>
  <text x="245" y="118" font-size="14" fill="#1b1f2a">+ getName(): string</text>
  <text x="245" y="138" font-size="14" font-style="italic" fill="#e63946">+ getSound(): string  (abstract)</text>
  <text x="245" y="158" font-size="14" fill="#1b1f2a">+ speak(): string</text>
  <text x="245" y="178" font-size="14" fill="#1b1f2a">+ toString(): string</text>
  <!-- Cat -->
  <rect x="60" y="260" width="260" height="100" rx="6" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <rect x="60" y="260" width="260" height="34" rx="6" fill="#457b9d"/>
  <text x="190" y="283" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Cat</text>
  <text x="75" y="318" font-size="14" fill="#1b1f2a">+ override getSound(): string</text>
  <text x="75" y="342" font-size="14" fill="#1b1f2a">+ override toString(): string</text>
  <!-- Dog -->
  <rect x="440" y="260" width="260" height="120" rx="6" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <rect x="440" y="260" width="260" height="34" rx="6" fill="#457b9d"/>
  <text x="570" y="283" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Dog</text>
  <text x="455" y="318" font-size="14" fill="#1b1f2a">+ override getSound(): string</text>
  <text x="455" y="342" font-size="14" fill="#1b1f2a">+ override toString(): string</text>
  <text x="455" y="366" font-size="14" fill="#2a9d8f">+ wagTail(): string</text>
  <!-- arrows -->
  <line x1="190" y1="260" x2="320" y2="192" stroke="#1d3557" stroke-width="2" marker-end="url(#tri)"/>
  <line x1="570" y1="260" x2="440" y2="192" stroke="#1d3557" stroke-width="2" marker-end="url(#tri)"/>
  <text x="380" y="232" text-anchor="middle" font-size="13" fill="#5b6472">extends (is-a)</text>
  <!-- key -->
  <text x="20" y="390" font-size="12" fill="#5b6472"># protected</text><text x="100" y="390" font-size="12" fill="#5b6472">+ public</text><text x="170" y="390" font-size="12" font-style="italic" fill="#5b6472">italic = abstract</text>
</svg>
