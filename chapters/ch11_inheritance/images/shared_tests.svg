<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d3557"/>
    </marker>
  </defs>
  <rect x="230" y="20" width="300" height="100" rx="6" fill="#1d3557"/>
  <text x="380" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">tests/account_rules.ts</text>
  <text x="380" y="70" text-anchor="middle" font-size="13" fill="#a8dadc">testAccountRules(kind, makeAccount)</text>
  <text x="380" y="92" text-anchor="middle" font-size="13" fill="#ffffff">9 rules every account keeps</text>
  <text x="380" y="110" text-anchor="middle" font-size="12" fill="#a8dadc">(registers the tests - runs none itself)</text>
  <rect x="30" y="180" width="320" height="100" rx="6" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <text x="190" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#457b9d">savings.test.ts</text>
  <text x="190" y="230" text-anchor="middle" font-size="12" fill="#1b1f2a">testAccountRules("SavingsAccount", ...)</text>
  <text x="190" y="252" text-anchor="middle" font-size="13" fill="#2a9d8f">9 shared tests</text>
  <text x="190" y="270" text-anchor="middle" font-size="13" fill="#e63946">+ 4 of its own (no overdraft, interest)</text>
  <rect x="410" y="180" width="320" height="100" rx="6" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <text x="570" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#457b9d">current.test.ts</text>
  <text x="570" y="230" text-anchor="middle" font-size="12" fill="#1b1f2a">testAccountRules("CurrentAccount", ...)</text>
  <text x="570" y="252" text-anchor="middle" font-size="13" fill="#2a9d8f">9 shared tests</text>
  <text x="570" y="270" text-anchor="middle" font-size="13" fill="#e63946">+ 4 of its own (the overdraft)</text>
  <line x1="320" y1="120" x2="220" y2="176" stroke="#1d3557" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="120" x2="540" y2="176" stroke="#1d3557" stroke-width="2" marker-end="url(#arr)"/>
</svg>
