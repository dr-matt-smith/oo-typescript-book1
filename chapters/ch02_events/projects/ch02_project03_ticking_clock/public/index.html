<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Ticking Clock</title>
  </head>
  <body>
    <main>
      <h1>Ticking Clock</h1>
      <section class="card centred">
        <div id="clock" class="clock">--:--:--</div>
        <p id="status" class="muted">(if you can read this, dist/app.js has not run - build the project)</p>
        <button id="pause">Pause</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
