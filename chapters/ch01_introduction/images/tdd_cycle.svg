<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Arial, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/>
    </marker>
  </defs>
  <g text-anchor="middle">
    <circle cx="160" cy="150" r="88" fill="#e63946"/>
    <text x="160" y="140" font-size="26" font-weight="bold" fill="#ffffff">RED</text>
    <text x="160" y="164" font-size="13" fill="#ffffff">write a test for</text>
    <text x="160" y="181" font-size="13" fill="#ffffff">what you want next -</text>
    <text x="160" y="198" font-size="13" fill="#ffffff">watch it fail</text>

    <circle cx="380" cy="150" r="88" fill="#2a9d8f"/>
    <text x="380" y="140" font-size="26" font-weight="bold" fill="#ffffff">GREEN</text>
    <text x="380" y="164" font-size="13" fill="#ffffff">write just enough</text>
    <text x="380" y="181" font-size="13" fill="#ffffff">code to make every</text>
    <text x="380" y="198" font-size="13" fill="#ffffff">test pass</text>

    <circle cx="600" cy="150" r="88" fill="#457b9d"/>
    <text x="600" y="140" font-size="26" font-weight="bold" fill="#ffffff">REFACTOR</text>
    <text x="600" y="164" font-size="13" fill="#ffffff">tidy the code up -</text>
    <text x="600" y="181" font-size="13" fill="#ffffff">the tests check you</text>
    <text x="600" y="198" font-size="13" fill="#ffffff">broke nothing</text>
  </g>
  <g stroke="#1d3557" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="250" y1="150" x2="288" y2="150"/>
    <line x1="470" y1="150" x2="508" y2="150"/>
    <path d="M 600 240 Q 600 300 380 300 Q 160 300 160 244"/>
  </g>
  <text x="380" y="322" font-size="13" fill="#5b6472" text-anchor="middle">... and round again, one small step at a time</text>
  <text x="380" y="36" font-size="15" fill="#1b1f2a" text-anchor="middle">Test-driven development: the test comes first</text>
</svg>
