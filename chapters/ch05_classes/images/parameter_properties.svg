<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3557">The same class, written two ways</text>

  <!-- long form -->
  <rect x="20" y="50" width="370" height="300" rx="10" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <text x="205" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">The long way (as in Java)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#1b1f2a">
    <text x="36" y="108">export class Student {</text>
    <text x="52" y="132" fill="#e63946">private id: number;</text>
    <text x="52" y="152" fill="#e63946">private firstName: string;</text>
    <text x="52" y="180">constructor(<tspan fill="#2a9d8f">id: number,</tspan></text>
    <text x="148" y="200" fill="#2a9d8f">firstName: string) {</text>
    <text x="68" y="226" fill="#f4a261">this.id = id;</text>
    <text x="68" y="246" fill="#f4a261">this.firstName = firstName;</text>
    <text x="52" y="270">}</text>
    <text x="36" y="294">}</text>
  </g>
  <text x="36" y="330" font-size="13" fill="#1b1f2a">fields + parameters + assignments: 3 places</text>

  <!-- short form -->
  <rect x="410" y="50" width="370" height="300" rx="10" fill="#f1faee" stroke="#2a9d8f" stroke-width="2"/>
  <text x="595" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">Parameter properties</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#1b1f2a">
    <text x="426" y="108">export class Student {</text>
    <text x="442" y="132">constructor(</text>
    <text x="458" y="156"><tspan fill="#e63946">private</tspan> <tspan fill="#2a9d8f">id: number,</tspan></text>
    <text x="458" y="180"><tspan fill="#e63946">private</tspan> <tspan fill="#2a9d8f">firstName: string,</tspan></text>
    <text x="442" y="204">) {}</text>
    <text x="426" y="228">}</text>
  </g>
  <text x="426" y="268" font-size="13" fill="#1b1f2a">the word <tspan font-weight="bold" fill="#e63946">private</tspan> in front of a parameter</text>
  <text x="426" y="288" font-size="13" fill="#1b1f2a">declares the field <tspan font-weight="bold">and</tspan> sets it from the</text>
  <text x="426" y="308" font-size="13" fill="#1b1f2a">argument: 1 place, nothing to forget</text>

  <!-- key -->
  <g font-size="13" fill="#1b1f2a">
    <rect x="150" y="366" width="14" height="14" fill="#e63946"/><text x="170" y="378">the field</text>
    <rect x="270" y="366" width="14" height="14" fill="#2a9d8f"/><text x="290" y="378">the parameter</text>
    <rect x="420" y="366" width="14" height="14" fill="#f4a261"/><text x="440" y="378">copying one into the other</text>
  </g>
</svg>
