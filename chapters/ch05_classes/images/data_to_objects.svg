<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3557">From plain data to objects</text>

  <!-- data -->
  <text x="140" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">students.json (data)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#1b1f2a">
    <rect x="20" y="76" width="240" height="64" rx="8" fill="#f1faee" stroke="#a8dadc" stroke-width="2"/>
    <text x="32" y="100">{ id: 101,</text>
    <text x="32" y="120">  firstName: "Ada", ... }</text>
    <rect x="20" y="156" width="240" height="64" rx="8" fill="#f1faee" stroke="#a8dadc" stroke-width="2"/>
    <text x="32" y="180">{ id: 105,</text>
    <text x="32" y="200">  firstName: "Margaret" }</text>
  </g>
  <text x="140" y="246" text-anchor="middle" font-size="13" fill="#1b1f2a">just values - no methods</text>

  <!-- arrow -->
  <line x1="272" y1="148" x2="512" y2="148" stroke="#1d3557" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="392" y="128" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1b1f2a">data.map((d) =&gt;</text>
  <text x="392" y="174" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1b1f2a">new Student(d.id, ...))</text>
  <text x="392" y="200" text-anchor="middle" font-size="12" fill="#5b6472">the constructor runs once for each</text>

  <!-- objects -->
  <text x="655" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">Student objects</text>
  <g font-size="12" fill="#1b1f2a">
    <rect x="520" y="76" width="270" height="64" rx="8" fill="#ffffff" stroke="#457b9d" stroke-width="2"/>
    <text x="532" y="98" font-weight="bold">Ada Lovelace · Computing</text>
    <text x="532" y="120" font-family="Menlo, Consolas, monospace" fill="#457b9d">getFullName() toString() ...</text>
    <rect x="520" y="156" width="270" height="64" rx="8" fill="#ffffff" stroke="#457b9d" stroke-width="2"/>
    <text x="532" y="178" font-weight="bold">Margaret Hamilton · <tspan fill="#e63946">Undecided</tspan></text>
    <text x="532" y="200" font-family="Menlo, Consolas, monospace" fill="#457b9d">getFullName() toString() ...</text>
  </g>
  <text x="655" y="246" text-anchor="middle" font-size="13" fill="#1b1f2a">values + behaviour; defaults filled in</text>

  <rect x="120" y="270" width="560" height="44" rx="8" fill="#a8dadc" opacity="0.5"/>
  <text x="400" y="297" text-anchor="middle" font-size="14" fill="#1b1f2a">One class (the blueprint), as many objects as there are rows of data</text>
</svg>
