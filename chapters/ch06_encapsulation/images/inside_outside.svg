<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e63946"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3557">A Pet object: the outside and the inside</text>

  <!-- main.ts -->
  <rect x="20" y="150" width="130" height="70" rx="10" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
  <text x="85" y="182" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1f2a">main.ts</text>
  <text x="85" y="204" text-anchor="middle" font-size="13" fill="#1b1f2a">(or a test)</text>

  <!-- outer ring: public -->
  <rect x="220" y="55" width="560" height="320" rx="18" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
  <text x="240" y="82" font-size="15" font-weight="bold" fill="#1d3557">public - the outside: anyone may call these</text>
  <text x="240" y="108" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">getName()  setName(name)  getSpecies()  getAge()</text>
  <text x="240" y="130" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">setAge(age)  haveBirthday()  isHungry()</text>
  <text x="240" y="152" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">play()  feed()  toString()</text>

  <!-- inner box: private -->
  <rect x="300" y="180" width="400" height="170" rx="14" fill="#1d3557"/>
  <text x="320" y="207" font-size="15" font-weight="bold" fill="#f1faee">private - the inside: only Pet's own code</text>
  <text x="320" y="235" font-size="14" fill="#f1faee" font-family="Courier New, monospace">name: string</text>
  <text x="320" y="257" font-size="14" fill="#f1faee" font-family="Courier New, monospace">readonly species: string</text>
  <text x="320" y="279" font-size="14" fill="#f1faee" font-family="Courier New, monospace">age: number</text>
  <text x="320" y="301" font-size="14" fill="#f1faee" font-family="Courier New, monospace">hungry: boolean</text>
  <text x="565" y="235" font-size="14" fill="#f1faee" font-family="Courier New, monospace">checkName()</text>
  <text x="565" y="257" font-size="14" fill="#f1faee" font-family="Courier New, monospace">checkAge()</text>
  <text x="320" y="333" font-size="13" fill="#f4a261">the setters check every value before it gets in here</text>

  <!-- allowed arrow -->
  <line x1="150" y1="170" x2="232" y2="130" stroke="#1d3557" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="125" y="125" font-size="13" fill="#2a9d8f" font-weight="bold">pet.setAge(4)</text>

  <!-- blocked arrow -->
  <line x1="150" y1="205" x2="312" y2="278" stroke="#e63946" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowRed)"/>
  <text x="40" y="262" font-size="13" fill="#e63946" font-weight="bold">pet.age = -3</text>
  <text x="40" y="280" font-size="12" fill="#e63946">compile error</text>
  <circle cx="232" cy="242" r="12" fill="#ffffff" stroke="#e63946" stroke-width="2.5"/>
  <line x1="224" y1="234" x2="240" y2="250" stroke="#e63946" stroke-width="2.5"/>
  <line x1="240" y1="234" x2="224" y2="250" stroke="#e63946" stroke-width="2.5"/>
</svg>
