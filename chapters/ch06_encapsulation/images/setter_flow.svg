<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Arial, sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3557">What an assignment to thermostat.target really does</text>

  <!-- caller -->
  <rect x="20" y="110" width="180" height="70" rx="10" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
  <text x="110" y="140" text-anchor="middle" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">thermostat</text>
  <text x="110" y="162" text-anchor="middle" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">.target = value</text>

  <line x1="200" y1="145" x2="258" y2="145" stroke="#1d3557" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- setter -->
  <rect x="260" y="80" width="230" height="130" rx="12" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
  <text x="375" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3557" font-family="Courier New, monospace">set target(celsius)</text>
  <text x="375" y="138" text-anchor="middle" font-size="14" fill="#1b1f2a">from 5 to 30?</text>
  <text x="375" y="162" text-anchor="middle" font-size="14" fill="#1b1f2a">a whole or half degree?</text>
  <text x="375" y="192" text-anchor="middle" font-size="12" fill="#5b6472">a method, called by an assignment</text>

  <!-- yes path -->
  <line x1="490" y1="115" x2="578" y2="85" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="520" y="88" font-size="14" font-weight="bold" fill="#2a9d8f">yes</text>
  <rect x="580" y="50" width="200" height="70" rx="10" fill="#2a9d8f" fill-opacity="0.15" stroke="#2a9d8f" stroke-width="2"/>
  <text x="680" y="80" text-anchor="middle" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">this.#target = celsius</text>
  <text x="680" y="102" text-anchor="middle" font-size="13" fill="#1b1f2a">stored</text>

  <!-- no path -->
  <line x1="490" y1="175" x2="578" y2="205" stroke="#e63946" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="525" y="222" font-size="14" font-weight="bold" fill="#e63946">no</text>
  <rect x="580" y="170" width="200" height="90" rx="10" fill="#e63946" fill-opacity="0.12" stroke="#e63946" stroke-width="2"/>
  <text x="680" y="198" text-anchor="middle" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">throw new Error(...)</text>
  <text x="680" y="222" text-anchor="middle" font-size="13" fill="#1b1f2a">#target unchanged;</text>
  <text x="680" y="242" text-anchor="middle" font-size="13" fill="#1b1f2a">main.ts catches it</text>

  <text x="400" y="285" text-anchor="middle" font-size="13" fill="#5b6472">Reading thermostat.target calls get target() the same way - the caller never sees #target.</text>
</svg>
