<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Traffic Light</title>
  </head>
  <body>
    <main>
      <h1>Traffic Light</h1>
      <section class="card junction">
        <div class="housing" aria-hidden="true">
          <div class="lamp red" id="lamp-red"></div>
          <div class="lamp amber" id="lamp-amber"></div>
          <div class="lamp green" id="lamp-green"></div>
        </div>
        <div class="readout">
          <h2 id="light-name"></h2>
          <p id="colour" class="big">(if you can read this, dist/app.js has not run - build the project)</p>
          <p id="seconds" class="muted"></p>
          <div class="controls">
            <button id="next">Next</button>
            <label><input type="checkbox" id="auto" /> Change by itself</label>
          </div>
        </div>
      </section>
    </main>
    <!-- app.js is built from src/main.ts. Loaded last, so the elements above already exist. -->
    <script src="app.js"></script>
  </body>
</html>
