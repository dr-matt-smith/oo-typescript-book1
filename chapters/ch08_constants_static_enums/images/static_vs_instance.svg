<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3557">static belongs to the class; everything else belongs to each object</text>

  <!-- the class -->
  <rect x="250" y="55" width="300" height="130" rx="10" fill="#1d3557"/>
  <text x="400" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">class Ticket</text>
  <text x="400" y="100" text-anchor="middle" font-size="13" fill="#a8dadc">one copy, however many tickets exist</text>
  <rect x="270" y="112" width="260" height="60" rx="6" fill="#f1faee"/>
  <text x="285" y="133" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">static readonly PREFIX = "A"</text>
  <text x="285" y="157" font-size="14" fill="#e63946" font-family="Courier New, monospace" font-weight="bold">static nextNumber = 4</text>

  <!-- arrows -->
  <line x1="330" y1="185" x2="140" y2="250" stroke="#457b9d" stroke-width="2"/>
  <line x1="400" y1="185" x2="400" y2="250" stroke="#457b9d" stroke-width="2"/>
  <line x1="470" y1="185" x2="660" y2="250" stroke="#457b9d" stroke-width="2"/>
  <text x="400" y="225" text-anchor="middle" font-size="13" fill="#457b9d">new Ticket() takes nextNumber, then adds 1 to it</text>

  <!-- objects -->
  <rect x="40" y="250" width="200" height="80" rx="10" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
  <text x="140" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">first: Ticket</text>
  <text x="140" y="306" text-anchor="middle" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">readonly number = 1</text>

  <rect x="300" y="250" width="200" height="80" rx="10" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
  <text x="400" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">second: Ticket</text>
  <text x="400" y="306" text-anchor="middle" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">readonly number = 2</text>

  <rect x="560" y="250" width="200" height="80" rx="10" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
  <text x="660" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3557">third: Ticket</text>
  <text x="660" y="306" text-anchor="middle" font-size="14" fill="#1b1f2a" font-family="Courier New, monospace">readonly number = 3</text>

  <text x="400" y="362" text-anchor="middle" font-size="14" fill="#1b1f2a">Use Ticket.PREFIX and Ticket.issuedCount() - on the class. Use first.number - on an object.</text>
</svg>
