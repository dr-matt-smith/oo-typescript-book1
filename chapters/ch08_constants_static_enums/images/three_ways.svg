<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Arial, sans-serif" xml:space="preserve">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3557">Three ways to write a fixed set of values</text>
  <text x="225" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#457b9d">What you write (TypeScript)</text>
  <text x="620" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#457b9d">What runs (JavaScript)</text>

  <!-- row 1: enum -->
  <rect x="20" y="78" width="410" height="80" rx="8" fill="#f1faee" stroke="#f4a261" stroke-width="2"/>
  <text x="34" y="100" font-size="14" font-weight="bold" fill="#1d3557">1. enum</text>
  <text x="34" y="124" font-size="13" fill="#1b1f2a" font-family="Courier New, monospace">enum DietEnum {</text>
  <text x="34" y="144" font-size="13" fill="#1b1f2a" font-family="Courier New, monospace">  Vegan = "vegan", ... }</text>
  <rect x="470" y="78" width="310" height="80" rx="8" fill="#f1faee" stroke="#f4a261" stroke-width="2"/>
  <text x="484" y="108" font-size="13" fill="#1b1f2a">a real object is made:</text>
  <text x="484" y="132" font-size="13" fill="#1b1f2a" font-family="Courier New, monospace">DietEnum.Vegan is "vegan"</text>
  <text x="484" y="150" font-size="12" fill="#5b6472">but a plain "vegan" is not accepted as one</text>
  <line x1="430" y1="118" x2="466" y2="118" stroke="#457b9d" stroke-width="2"/>
  <polygon points="466,112 470,118 466,124" fill="#457b9d"/>

  <!-- row 2: union -->
  <rect x="20" y="172" width="410" height="80" rx="8" fill="#f1faee" stroke="#2a9d8f" stroke-width="3"/>
  <text x="34" y="194" font-size="14" font-weight="bold" fill="#1d3557">2. string-literal union (this book's choice)</text>
  <text x="34" y="222" font-size="13" fill="#1b1f2a" font-family="Courier New, monospace">type Diet =</text>
  <text x="34" y="242" font-size="13" fill="#1b1f2a" font-family="Courier New, monospace">  "vegan" | "vegetarian" | "meat";</text>
  <rect x="470" y="172" width="310" height="80" rx="8" fill="#f1faee" stroke="#2a9d8f" stroke-width="3"/>
  <text x="484" y="202" font-size="13" fill="#1b1f2a">nothing at all - the type is erased;</text>
  <text x="484" y="224" font-size="13" fill="#1b1f2a">values are plain strings: "vegan"</text>
  <line x1="430" y1="212" x2="466" y2="212" stroke="#457b9d" stroke-width="2"/>
  <polygon points="466,206 470,212 466,218" fill="#457b9d"/>

  <!-- row 3: as const -->
  <rect x="20" y="266" width="410" height="100" rx="8" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <text x="34" y="288" font-size="14" font-weight="bold" fill="#1d3557">3. as const array (or object) + union from it</text>
  <text x="34" y="314" font-size="13" fill="#1b1f2a" font-family="Courier New, monospace">const DIETS = ["vegan", ...] as const;</text>
  <text x="34" y="334" font-size="13" fill="#1b1f2a" font-family="Courier New, monospace">type Diet = (typeof DIETS)[number];</text>
  <text x="34" y="354" font-size="12" fill="#5b6472">use when the program needs to loop over the values</text>
  <rect x="470" y="266" width="310" height="100" rx="8" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <text x="484" y="300" font-size="13" fill="#1b1f2a">a plain array of strings:</text>
  <text x="484" y="322" font-size="13" fill="#1b1f2a" font-family="Courier New, monospace">["vegan", "vegetarian", "meat"]</text>
  <text x="484" y="344" font-size="12" fill="#5b6472">the type is erased, the array stays</text>
  <line x1="430" y1="316" x2="466" y2="316" stroke="#457b9d" stroke-width="2"/>
  <polygon points="466,310 470,316 466,322" fill="#457b9d"/>

  <text x="400" y="390" text-anchor="middle" font-size="13" fill="#1b1f2a">In every case the compiler rejects "vegen" - the difference is what is left when the program runs.</text>
</svg>
