<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="Arial, sans-serif">
  <defs>
    <marker id="hollow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="800" height="430" fill="#ffffff"/>

  <!-- interfaces -->
  <g font-size="14" fill="#1b1f2a">
    <rect x="90" y="20" width="270" height="130" rx="6" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
    <text x="225" y="42" text-anchor="middle" font-size="12" fill="#457b9d">«interface»</text>
    <text x="225" y="62" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d3557">Instrument</text>
    <line x1="90" y1="72" x2="360" y2="72" stroke="#1d3557"/>
    <g font-family="Menlo, Consolas, monospace" font-size="13">
      <text x="104" y="94">readonly name: string</text>
      <text x="104" y="116">readonly strings?: number</text>
      <text x="104" y="138">play(): string</text>
    </g>

    <rect x="470" y="20" width="250" height="130" rx="6" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
    <text x="595" y="42" text-anchor="middle" font-size="12" fill="#457b9d">«interface»</text>
    <text x="595" y="62" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d3557">Tunable</text>
    <line x1="470" y1="72" x2="720" y2="72" stroke="#1d3557"/>
    <g font-family="Menlo, Consolas, monospace" font-size="13">
      <text x="484" y="94">readonly name: string</text>
      <text x="484" y="116">isInTune(): boolean</text>
      <text x="484" y="138">tune(): void</text>
    </g>
  </g>

  <!-- implements arrows (dashed, hollow head) -->
  <g stroke="#1d3557" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#hollow)">
    <path d="M105 250 L170 151"/>
    <path d="M300 250 L215 151"/>
    <path d="M495 250 L265 151"/>
    <path d="M690 250 L315 151"/>
    <path d="M520 250 L560 151"/>
    <path d="M710 250 L640 151"/>
  </g>

  <!-- classes -->
  <g font-size="14" fill="#1b1f2a">
    <rect x="20" y="250" width="170" height="70" rx="6" fill="#ffffff" stroke="#457b9d" stroke-width="2"/>
    <text x="105" y="276" text-anchor="middle" font-size="16" font-weight="bold">Drum</text>
    <text x="105" y="302" text-anchor="middle" fill="#5b6472">no strings</text>

    <rect x="215" y="250" width="170" height="70" rx="6" fill="#ffffff" stroke="#457b9d" stroke-width="2"/>
    <text x="300" y="276" text-anchor="middle" font-size="16" font-weight="bold">Flute</text>
    <text x="300" y="302" text-anchor="middle" fill="#5b6472">no strings</text>

    <rect x="410" y="250" width="170" height="70" rx="6" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text x="495" y="276" text-anchor="middle" font-size="16" font-weight="bold">Guitar</text>
    <text x="495" y="302" text-anchor="middle" fill="#1b1f2a">6 strings, tunable</text>

    <rect x="605" y="250" width="170" height="70" rx="6" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text x="690" y="276" text-anchor="middle" font-size="16" font-weight="bold">Violin</text>
    <text x="690" y="302" text-anchor="middle" fill="#1b1f2a">4 strings, tunable</text>
  </g>

  <!-- main.ts -->
  <rect x="20" y="345" width="755" height="70" rx="6" fill="#f1faee" stroke="#d6dde4"/>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#1b1f2a">
    <text x="36" y="372">const band: Instrument[] = [guitar, violin, new Drum(), new Flute()];</text>
    <text x="36" y="398">const tunables: Tunable[] = [guitar, violin];  <tspan fill="#457b9d">// the same two objects</tspan></text>
  </g>
</svg>
