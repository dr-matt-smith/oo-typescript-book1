<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Shapes</title>
  </head>
  <body>
    <main>
      <h1>Shapes</h1>
      <div class="controls">
        <button id="add-circle">Add circle</button>
        <button id="add-rectangle">Add rectangle</button>
        <button id="add-triangle">Add triangle</button>
        <button id="clear" class="secondary">Clear</button>
      </div>
      <canvas id="canvas" width="720" height="240"></canvas>
      <section class="card">
        <p id="summary" class="muted">(if you can read this, dist/app.js has not run - build the project)</p>
        <table>
          <thead><tr><th>Shape</th><th>Area</th><th>Perimeter</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>
    <!-- app.js is built from src/main.ts. Loaded last, so the elements above already exist. -->
    <script src="app.js"></script>
  </body>
</html>
