<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>

  <!-- the three parts -->
  <rect x="30" y="60" width="210" height="170" rx="10" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
  <text x="135" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3557">The view</text>
  <text x="135" y="122" text-anchor="middle" font-size="15" fill="#1b1f2a">TallyView, dom.ts</text>
  <text x="135" y="146" text-anchor="middle" font-size="15" fill="#1b1f2a">and the page itself</text>
  <text x="135" y="200" text-anchor="middle" font-size="14" font-style="italic" fill="#1d3557">touches the DOM</text>

  <rect x="295" y="60" width="210" height="170" rx="10" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
  <text x="400" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3557">main.ts</text>
  <text x="400" y="122" text-anchor="middle" font-size="15" fill="#1b1f2a">makes the model</text>
  <text x="400" y="146" text-anchor="middle" font-size="15" fill="#1b1f2a">and the view, and</text>
  <text x="400" y="170" text-anchor="middle" font-size="15" fill="#1b1f2a">joins them up</text>

  <rect x="560" y="60" width="210" height="170" rx="10" fill="#ffffff" stroke="#2a9d8f" stroke-width="3"/>
  <text x="665" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3557">The model</text>
  <text x="665" y="122" text-anchor="middle" font-size="15" fill="#1b1f2a">Tally: the count,</text>
  <text x="665" y="146" text-anchor="middle" font-size="15" fill="#1b1f2a">the capacity, the rules</text>
  <text x="665" y="200" text-anchor="middle" font-size="14" font-style="italic" fill="#2a9d8f">no DOM at all</text>

  <!-- 1: event -->
  <line x1="240" y1="105" x2="291" y2="105" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="267" y="40" text-anchor="middle" font-size="14" fill="#e63946" font-weight="bold">1 click</text>
  <line x1="267" y1="46" x2="267" y2="100" stroke="#e63946" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 2: change the model -->
  <line x1="505" y1="105" x2="556" y2="105" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532" y="32" text-anchor="middle" font-size="14" fill="#e63946" font-weight="bold">2 change it</text>
  <text x="532" y="50" text-anchor="middle" font-size="13" fill="#1b1f2a">tally.increment()</text>
  <line x1="532" y1="56" x2="532" y2="100" stroke="#e63946" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 3: render -->
  <line x1="295" y1="195" x2="244" y2="195" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="267" y="252" text-anchor="middle" font-size="14" fill="#e63946" font-weight="bold">3 render</text>
  <line x1="267" y1="200" x2="267" y2="238" stroke="#e63946" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 4: the view reads the model -->
  <path d="M135,230 L135,285 L665,285 L665,234" fill="none" stroke="#457b9d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="400" y="278" text-anchor="middle" font-size="14" fill="#1b1f2a"><tspan fill="#e63946" font-weight="bold">4</tspan> the view reads the model: tally.count, tally.isFull</text>

  <!-- how each part is checked -->
  <text x="135" y="330" text-anchor="middle" font-size="14" fill="#457b9d" font-weight="bold">checked by looking</text>
  <text x="135" y="350" text-anchor="middle" font-size="13" fill="#1b1f2a">(the browser, the harness)</text>
  <text x="665" y="330" text-anchor="middle" font-size="14" fill="#2a9d8f" font-weight="bold">tested with Deno.test</text>
  <text x="665" y="350" text-anchor="middle" font-size="13" fill="#1b1f2a">(every rule, every edge)</text>
</svg>
