<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Pet</title>
  </head>
  <body>
    <main>
      <h1>Pet</h1>
      <section class="card">
        <p id="description">(if you can read this, dist/app.js has not run - build the project)</p>
        <p id="mood"></p>
        <div class="controls">
          <button id="play">Play</button>
          <button id="feed">Feed</button>
          <button id="birthday">Birthday</button>
        </div>
      </section>
      <section class="card">
        <div class="controls">
          <input id="new-name" type="text" placeholder="New name" aria-label="New name" />
          <button id="rename">Rename</button>
        </div>
        <p id="message" class="bad"></p>
      </section>
    </main>
    <!-- app.js is built from src/main.ts. Loaded last, so the elements above already exist. -->
    <script src="app.js"></script>
  </body>
</html>
