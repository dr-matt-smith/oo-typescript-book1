<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Sort Anything</title>
  </head>
  <body>
    <main>
      <h1>Sort Anything</h1>
      <p><label><input type="checkbox" id="sorted" /> Sorted</label></p>
      <section class="card">
        <h2>Songs <span class="muted">shortest first</span></h2>
        <ol id="songs"><li>(if you can read this, dist/app.js has not run - build the project)</li></ol>
      </section>
      <section class="card">
        <h2>Planets <span class="muted">nearest the Sun first</span></h2>
        <ol id="planets"></ol>
      </section>
      <section class="card">
        <h2>Mountains <span class="muted">tallest first</span></h2>
        <ol id="mountains"></ol>
      </section>
      <!-- CHALLENGE 2 -->
      <section class="card">
        <h2>Cities <span class="muted">biggest first</span></h2>
        <ol id="cities"></ol>
      </section>
    </main>
    <!-- app.js is built from src/main.ts. Loaded last, so the elements above already exist. -->
    <script src="app.js"></script>
  </body>
</html>
