<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="Arial, sans-serif">
  <rect width="780" height="300" fill="#ffffff"/>
  <text x="390" y="30" font-size="15" fill="#1b1f2a" text-anchor="middle">The same function, three ways</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <text x="40" y="80" fill="#1b1f2a"><tspan fill="#e63946">function</tspan> toFahrenheit(celsius: number): number { <tspan fill="#e63946">return</tspan> celsius * 9 / 5 + 32; }</text>
    <text x="40" y="140" fill="#1b1f2a"><tspan fill="#e63946">const</tspan> toFahrenheit = (celsius: number): number <tspan fill="#2a9d8f" font-weight="bold">=&gt;</tspan> { <tspan fill="#e63946">return</tspan> celsius * 9 / 5 + 32; };</text>
    <text x="40" y="200" fill="#1b1f2a"><tspan fill="#e63946">const</tspan> toFahrenheit = (celsius: number): number <tspan fill="#2a9d8f" font-weight="bold">=&gt;</tspan> celsius * 9 / 5 + 32;</text>
  </g>
  <g font-size="12" fill="#5b6472">
    <text x="40" y="100">a function declaration (Chapter 1)</text>
    <text x="40" y="160">an arrow function with a { block } body - it needs return</text>
    <text x="40" y="220">an arrow function with an expression body - the value after =&gt; is returned</text>
  </g>
  <g font-size="13" fill="#1d3557">
    <rect x="40" y="238" width="700" height="48" rx="8" fill="#f1faee" stroke="#457b9d"/>
    <text x="56" y="258">Java lambda:</text>
    <text x="160" y="258" font-family="ui-monospace, Menlo, Consolas, monospace">celsius -&gt; celsius * 9 / 5 + 32</text>
    <text x="56" y="276">TypeScript arrow:</text>
    <text x="160" y="276" font-family="ui-monospace, Menlo, Consolas, monospace">(celsius) =&gt; celsius * 9 / 5 + 32</text>
    <text x="470" y="276" font-size="12" fill="#5b6472">=&gt; (equals), not -&gt; (minus)</text>
  </g>
</svg>
