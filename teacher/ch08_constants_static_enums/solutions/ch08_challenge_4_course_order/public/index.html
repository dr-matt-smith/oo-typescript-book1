<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Menu Order</title>
  </head>
  <body>
    <main>
      <h1>Menu Order</h1>
      <div class="controls">Show: <span id="filters"></span></div>
      <section class="card" id="menu">
        <p class="muted">(if you can read this, dist/app.js has not run - build the project)</p>
      </section>
      <section class="card">
        <h2>Your order</h2>
        <ul id="order"></ul>
        <p id="total" class="total"></p>
        <button id="clear" class="secondary">Clear the order</button>
      </section>
    </main>
    <!-- app.js is built from src/main.ts. Loaded last, so the elements above already exist. -->
    <script src="app.js"></script>
  </body>
</html>
