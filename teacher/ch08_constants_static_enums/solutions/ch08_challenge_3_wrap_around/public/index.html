<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Ticket Numbers</title>
  </head>
  <body>
    <main>
      <h1>Ticket Numbers</h1>
      <div class="desk">
        <section class="card">
          <h2>Customers</h2>
          <button id="take">Take a ticket</button>
          <p id="your-ticket" class="muted">(if you can read this, dist/app.js has not run - build the project)</p>
          <h3>Waiting</h3>
          <ul id="waiting" class="tickets"></ul>
        </section>
        <section class="card">
          <h2>Counter</h2>
          <p class="muted">Now serving</p>
          <p id="serving" class="serving"></p>
          <button id="serve">Serve next</button>
        </section>
      </div>
      <p><span id="issued" class="muted"></span> <button id="new-day" class="secondary">New day</button></p>
    </main>
    <!-- app.js is built from src/main.ts. Loaded last, so the elements above already exist. -->
    <script src="app.js"></script>
  </body>
</html>
