<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Roman Numerals</title>
  </head>
  <body>
    <main>
      <h1>Roman Numerals</h1>
      <section class="card">
        <label>Number <input type="number" id="number" value="1994" min="1" max="3999" /></label>
        <p id="numeral" class="numeral">(if you can read this, dist/app.js has not run - build the project)</p>
      </section>
      <!-- CHALLENGE 4 -->
      <section class="card">
        <label>Numeral <input type="text" id="numeral-box" value="MMXXVI" /></label>
        <p id="number-out" class="numeral"></p>
      </section>
      <section class="card">
        <h2>Some years</h2>
        <table>
          <thead><tr><th>Year</th><th>Roman</th></tr></thead>
          <tbody id="examples"></tbody>
        </table>
      </section>
    </main>
    <!-- app.js is built from src/main.ts. Loaded last, so the elements above already exist. -->
    <script src="app.js"></script>
  </body>
</html>
