<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Character Count</title>
  </head>
  <body>
    <main>
      <h1>Character Count</h1>
      <section class="card">
        <label for="message">Your message (press Escape to clear it)</label>
        <textarea id="message" rows="5"></textarea>
        <p id="counter" class="muted">(if you can read this, dist/app.js has not run - build the project)</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
