    <link rel="stylesheet" href="styles.css" />
    <title>Stopwatch</title>

  <body>
    <main>
      <h1>Stopwatch</h1> <!-- CHALLENGE 4 -->

    </main>
    <script src="app.js"></script>
  </body>
