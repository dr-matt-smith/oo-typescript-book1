<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Room Counter</title>
  </head>
  <body>
    <main>
      <h1>Room Counter</h1>
      <section class="card tally">
        <p class="muted">People in the lab</p>
        <p id="count" class="count">(if you can read this, dist/app.js has not run - build the project)</p>
        <p id="status"></p>
        <div class="controls">
          <button id="remove" aria-label="One person leaves">−</button>
          <button id="add" aria-label="One person comes in">+</button>
          <button id="reset" class="secondary">Reset</button>
        </div>
      </section>
    </main>
    <!-- app.js is built from src/main.ts. Loaded last, so the elements above already exist. -->
    <script src="app.js"></script>
  </body>
</html>
