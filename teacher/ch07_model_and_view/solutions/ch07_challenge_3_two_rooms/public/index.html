<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Room Counter</title>
  </head>
  <body>
    <main>
      <h1>Room Counter</h1>
      <!-- CHALLENGE 3: two rooms; each part of the page has an id, and its elements have classes -->
      <div class="rooms">
        <section id="lab" class="card tally">
          <p class="muted">People in the lab</p>
          <p class="count">(if you can read this, dist/app.js has not run - build the project)</p>
          <p class="status"></p>
          <div class="controls">
            <button class="remove" aria-label="One person leaves the lab">−</button>
            <button class="add" aria-label="One person comes into the lab">+</button>
            <button class="reset secondary">Reset</button>
          </div>
        </section>
        <section id="library" class="card tally">
          <p class="muted">People in the library</p>
          <p class="count"></p>
          <p class="status"></p>
          <div class="controls">
            <button class="remove" aria-label="One person leaves the library">−</button>
            <button class="add" aria-label="One person comes into the library">+</button>
            <button class="reset secondary">Reset</button>
          </div>
        </section>
      </div>
    </main>
    <!-- app.js is built from src/main.ts. Loaded last, so the elements above already exist. -->
    <script src="app.js"></script>
  </body>
</html>
