<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/>
    </marker>
  </defs>
  <rect width="800" height="360" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="15" fill="#1b1f2a">The user types into the box:</text>
  <rect x="270" y="42" width="260" height="44" rx="8" fill="#f1faee" stroke="#1d3557" stroke-width="2"/>
  <text x="400" y="70" text-anchor="middle" font-size="17" font-family="Courier New, monospace" fill="#1b1f2a">&lt;b&gt;cheese&lt;/b&gt;</text>

  <path d="M330,86 L190,140" stroke="#1d3557" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M470,86 L610,140" stroke="#1d3557" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- innerHTML -->
  <rect x="30" y="146" width="340" height="40" rx="6" fill="#ffffff" stroke="#e63946" stroke-width="2"/>
  <text x="200" y="172" text-anchor="middle" font-size="16" font-family="Courier New, monospace" fill="#1b1f2a">span.innerHTML = name</text>
  <text x="200" y="214" text-anchor="middle" font-size="14" fill="#1b1f2a">the browser reads it as HTML: a &lt;b&gt; element</text>
  <rect x="30" y="228" width="340" height="50" rx="6" fill="#f1faee" stroke="#e63946" stroke-width="2"/>
  <text x="200" y="260" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b1f2a">cheese</text>
  <text x="200" y="306" text-anchor="middle" font-size="14" fill="#e63946" font-weight="bold">an &lt;img onerror="..."&gt; would run code</text>
  <text x="200" y="326" text-anchor="middle" font-size="14" fill="#e63946">never for text a user typed</text>

  <!-- textContent -->
  <rect x="430" y="146" width="340" height="40" rx="6" fill="#ffffff" stroke="#2a9d8f" stroke-width="2"/>
  <text x="600" y="172" text-anchor="middle" font-size="16" font-family="Courier New, monospace" fill="#1b1f2a">span.textContent = name</text>
  <text x="600" y="214" text-anchor="middle" font-size="14" fill="#1b1f2a">the browser shows the characters as they are</text>
  <rect x="430" y="228" width="340" height="50" rx="6" fill="#f1faee" stroke="#2a9d8f" stroke-width="2"/>
  <text x="600" y="260" text-anchor="middle" font-size="18" font-family="Courier New, monospace" fill="#1b1f2a">&lt;b&gt;cheese&lt;/b&gt;</text>
  <text x="600" y="306" text-anchor="middle" font-size="14" fill="#2a9d8f" font-weight="bold">nothing can run</text>
  <text x="600" y="326" text-anchor="middle" font-size="14" fill="#2a9d8f">always safe for user text</text>
</svg>
